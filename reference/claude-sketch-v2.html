function GeoPattern({width=400,height=160,color=D.teal,opacity=0.05}){
  const lines=[];
  for(let i=0;i<8;i++){
    const y=18+i*16;
    lines.push(React.createElement("path",{key:i,d:`M0 ${y} Q${width/4} ${y-7} ${width/2} ${y} Q${3*width/4} ${y+7} ${width} ${y}`,stroke:color,strokeWidth:"0.8",fill:"none",opacity:opacity*(1-i*0.09)}));
  }
  return React.createElement("svg",{width,height,viewBox:`0 0 ${width} ${height}`,style:{position:"absolute",bottom:0,left:0,pointerEvents:"none"}},
    ...lines,
    React.createElement("path",{d:"M0 0 L0 24 L4 24 L4 8 L8 8 L8 4 L24 4 L24 0",fill:color,opacity:opacity*2.2}),
    React.createElement("path",{d:`M${width} 0 L${width} 24 L${width-4} 24 L${width-4} 8 L${width-8} 8 L${width-8} 4 L${width-24} 4 L${width-24} 0`,fill:color,opacity:opacity*2.2})
  );
}

function Fade({children,delay=0,style={}}){

function Spark({data,color=D.teal,h=50,w=120}){
  if(!data||data.length<2)return null;
  const mn=Math.min(...data),mx=Math.max(...data),rng=mx-mn||1;
  const pts=data.map((v,i)=>{
    const x=(i/(data.length-1))*(w-4)+2;
    const y=h-2-((v-mn)/rng)*(h-4);
    return `${x},${y}`;
  });
  const last=pts[pts.length-1].split(",");
  return React.createElement("svg",{width:w,height:h,viewBox:`0 0 ${w} ${h}`,style:{overflow:"visible"}},
    React.createElement("polyline",{points:pts.join(" "),fill:"none",stroke:color,strokeWidth:"1.8",strokeLinecap:"round",strokeLinejoin:"round"}),
    React.createElement("circle",{cx:last[0],cy:last[1],r:"3",fill:color})
  );
}

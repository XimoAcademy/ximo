# Supabase local development configuration.
# Docs: https://supabase.com/docs/guides/cli/config
# NOTE: For production (Supabase Cloud), copy these templates into the
# Authentication → Email Templates section of the Supabase dashboard.
#
# content_path values are resolved from the PROJECT ROOT (where you run the
# CLI), not from this file's directory — hence the ./supabase/ prefix. With a
# bare ./email-templates/... path every CLI command aborts with
# LegacyDbConfigLoadError before it can even connect.

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://ximo.app", "http://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
max_frequency = "1s"

# ── Password Reset ──────────────────────────────────────────────────────────
[auth.email.template.recovery]
subject = "Restablece tu contraseña · Ximo"
content_path = "./supabase/email-templates/recovery.html"

# ── Email Change Confirmation ────────────────────────────────────────────────
[auth.email.template.email_change]
subject = "Confirma tu nuevo correo · Ximo"
content_path = "./supabase/email-templates/email_change.html"

# ── Signup Confirmation ──────────────────────────────────────────────────────
[auth.email.template.confirmation]
subject = "Confirma tu cuenta · Ximo"
content_path = "./supabase/email-templates/confirmation.html"

# ── Magic Link ───────────────────────────────────────────────────────────────
[auth.email.template.magic_link]
subject = "Tu enlace de acceso a Ximo"
content_path = "./supabase/email-templates/magic_link.html"

name: CI

on:
  push:
    branches: [main, international-expansion]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Lint is informational (the project has pre-existing style debt and the
      # build is the hard correctness gate). Surfaced, but doesn't fail CI.
      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Unit tests
        run: npm test

      # The app is null-safe: it builds with no env vars (Supabase/Stripe/Resend
      # features simply stay disabled), so CI needs no secrets.
      - name: Build
        run: npm run build

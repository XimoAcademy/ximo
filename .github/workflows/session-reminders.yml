name: Session reminders

# Recordatorios de las sesiones de soporte en vivo (24 h / 1 h / 10 min antes).
#
# Por qué aquí y no en vercel.json: el plan Hobby de Vercel solo permite UN
# cron diario, insuficiente para avisar 10 minutos antes. Este workflow hace
# de scheduler externo llamando al endpoint protegido.
#
# GitHub Actions NO es puntual: su cron suele retrasarse 5-20 minutos. La
# lógica de lib/scheduling/reminders.ts está hecha para tolerarlo (un aviso
# tardío se envía igual, con el tiempo real restante). Si en el futuro quieres
# precisión al minuto, cron-job.org apuntando a la misma URL es más puntual.
#
# Requiere dos repository secrets (Settings → Secrets and variables → Actions):
#   CRON_SECRET  — el mismo valor que la variable CRON_SECRET en Vercel.
#   APP_BASE_URL — URL de producción, sin barra final. Ej: https://ximo.com.mx

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: # permite lanzarlo a mano para probar

# Si una ejecución se retrasa, no acumular varias en paralelo.
concurrency:
  group: session-reminders
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger reminder job
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
        run: |
          if [ -z "$CRON_SECRET" ] || [ -z "$APP_BASE_URL" ]; then
            echo "::error::Faltan los secrets CRON_SECRET y/o APP_BASE_URL."
            exit 1
          fi

          # -sS: silencioso pero muestra errores. Se separa el cuerpo del código
          # HTTP para poder fallar el job si el endpoint no responde 200.
          response=$(curl -sS -m 60 -w "\n%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_BASE_URL/api/cron/session-reminders")

          status=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          echo "HTTP $status"
          echo "$body"

          if [ "$status" != "200" ]; then
            echo "::error::El endpoint respondió $status."
            exit 1
          fi
